# Data Runtime Agent configuration template.
#
# Copy this file to config.yaml and fill local secrets there:
#   cp "config template.yaml" config.yaml
#
# config.yaml is gitignored. Environment variables override YAML
# (see backend/app/config.py). Never put real passwords, API keys, or
# JWT secrets in this template.
#
# Database split: see docs/specs/01-domain-catalog-and-data.md §11.

app:
  name: data-runtime-agent
  environment: local
  timezone: Asia/Shanghai
  cors_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173

server:
  cors:
    allowed_methods: [GET, POST, OPTIONS]
    allowed_headers: [Authorization, Content-Type, X-Request-ID, Last-Event-ID]
    allow_credentials: false
    max_age_seconds: 600

auth:
  jwt:
    issuer: data-runtime-agent
    audience: data-runtime-agent-users
    algorithm: HS256
    secret: CHANGE_ME_JWT_SECRET
    access_token_expire_minutes: 120

mysql:
  host: localhost
  port: 3306
  # Two databases serve different roles. The business database is the
  # read-only gateway target; the system database owns the application
  # control plane. They never share an account's permissions at runtime.
  business_database: data_agent_ecommerce
  system_database: data_agent_system
  charset: utf8mb4
  pool_size: 10
  max_overflow: 20
  pool_recycle_seconds: 1800
  accounts:
    migration:
      username: agent_migration
      password: CHANGE_ME_MYSQL_PASSWORD
    control:
      username: agent_control
      password: CHANGE_ME_MYSQL_PASSWORD
    reader:
      username: agent_reader
      password: CHANGE_ME_MYSQL_PASSWORD
    writer:
      username: agent_writer
      password: CHANGE_ME_MYSQL_PASSWORD

milvus:
  # Embedded Milvus Lite. Must be true before `make index-catalog` and before
  # data queries; the runtime and indexer share this file-backed URI.
  enabled: true
  uri: ./data/catalog.milvus.db
  token: ""
  database: default
  collections:
    source_domain: catalog_source_domain
    object: catalog_object
    field_entity: catalog_field_entity
    relation: catalog_relation
  insert_batch_size: 256

catalog:
  source:
    source_id: mysql_ecommerce_local
    name: Ecommerce MySQL
    domain: ECOMMERCE_TRADE
    # Production collection is explicitly allowlisted. Omitting this list
    # indexes every non-excluded table in the configured database.
    include_tables:
      - shops
      - users
      - categories
      - products
      - orders
      - order_items
      - refunds
      - refund_items
    grain_overrides:
      users: buyer
    classification_overrides:
      users.phone: PHONE
      users.id_number: ID_CARD

runtime_agent:
  max_iterations: 6
  max_retrieval_rounds: 2
  max_query_retries: 1
  max_total_seconds: 60
  max_rows_per_query: 1000
  recommended_questions:
    - 昨天各品类的 GMV 是多少？
    - 昨天销售额是多少？
    - 昨天有多少已支付订单？
    - 昨天每个店铺的支付买家数？
    - 上周退款总金额是多少？
    - orders 表有哪些字段？
    - 昨天哪几个品类的退款最多？
    - 最近 7 天日均 GMV？
    - 各品类订单占比？
    - products 表有哪些字段？

retrieval_budget:
  max_source_candidates: 3
  max_object_candidates: 5
  max_fields_per_object: 8
  max_join_hops: 2
  max_context_tokens: 3000
  min_rerank_score: 0.55
  ambiguity_score_gap: 0.08

llm:
  # MiniMax example; override with DRA_LLM_BASE_URL / DRA_LLM_API_KEY / DRA_LLM_MODEL.
  base_url: https://api.minimaxi.com/anthropic
  api_key: CHANGE_ME_LLM_API_KEY
  model: MiniMax-M3
  protocol: anthropic
  timeout_seconds: 30
  max_retries: 2
  max_schema_repairs: 1
  retry_base_seconds: 0.25
  retry_cap_seconds: 5
  trust_env: false
  proxy_url: null
  temperature:
    agent: 0.1
    query_generation: 0.0
    response: 0.2
    summarizer: 0.0
    reranker: 0.0
  max_output_tokens:
    agent: 1200
    query_generation: 1600
    response: 1200
    summarizer: 800
    reranker: 800
  embedding:
    provider: fastembed
    model: BAAI/bge-small-zh-v1.5
    batch_size: 64
    cache_dir: .cache/fastembed
    trust_env: false

read_query:
  max_rows: 1000
  max_execution_ms: 5000
  max_tables: 5
  max_joins: 4
  require_time_filter_for_fact_table: true
  allow_select_star: false
  explain:
    enabled: true
    max_estimated_rows: 100000
    max_cost: 100000
  allowed_statement_types:
    - SELECT
    - WITH
  blocked_schemas:
    - information_schema
    - mysql
    - performance_schema
    - sys

permissions:
  default_policy_version: policy_local_v1
  allowed_domains: [ECOMMERCE_TRADE]
  allowed_source_ids: [mysql_ecommerce_local]
  denied_classifications:
    - PHONE
    - ID_CARD
    - PASSWORD
    - TOKEN
  row_scope_fields:
    shop_id: shop_id
  demo_scopes:
    u_demo_user:
      role: USER
      allowed_domains:
        - ECOMMERCE_TRADE
      allowed_source_ids:
        - mysql_ecommerce_local
      shop_ids:
        - shop_001
        - shop_002
    u_demo_admin:
      role: ADMIN
      allowed_domains:
        - ECOMMERCE_TRADE
      allowed_source_ids:
        - mysql_ecommerce_local
      shop_ids:
        - shop_001
        - shop_002
        - shop_003

memory:
  long_term:
    enabled: true
    allowed_keys:
      - timezone
      - default_shop_id
      - chart_preference
      - number_format
    require_user_confirmation: true

evaluation:
  cases_dir: tests/eval_cases
  reports_dir: reports
  golden_dir: tests/golden_results
  time_anchor: "2026-08-16T10:00:00+08:00"
  data_version: seed_v1
  catalog_version: catalog_v1
  random_seed: 0
