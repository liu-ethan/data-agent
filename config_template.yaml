# 配置模板：复制为 config.yaml 后填写本地值
#   cp config_template.yaml config.yaml
# config.yaml 含密钥，勿提交（见 .gitignore）

llm:
  api_key: ""
  base_url: ""
  model: ""

backend:
  host: "0.0.0.0"
  port: 8000
  jwt_secret: "change-me"
  admin_invite_code: "your-invite-code"
  # 相对 backend/ 目录；也可写绝对路径
  database_path: "data/ecommerce.db"
  cors_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

frontend:
  port: 5173
  # 浏览器访问后端的基址（勿尾斜杠）
  api_base_url: "http://127.0.0.1:8000"
