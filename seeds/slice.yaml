# 12 张业务表 + 15 条审核关系。不要扩表。
tables:
  - name: dim_store
    business_name: 门店
    domain: 门店
    grain: 一行一个线下店或电商仓店
  - name: dim_user
    business_name: 用户
    domain: 用户
    grain: 一行一个买家
  - name: dim_category
    business_name: 品类
    domain: 商品
    grain: 一行一个品类
  - name: dim_sku
    business_name: SKU
    domain: 商品
    grain: 一行一个可售 SKU
  - name: dim_channel
    business_name: 渠道
    domain: 营销
    grain: 一行一个成交/流量渠道
  - name: dim_campaign
    business_name: 营销活动
    domain: 营销
    grain: 一行一个投放活动
  - name: fact_order
    business_name: 订单
    domain: 订单
    grain: 一行一笔订单
  - name: fact_order_item
    business_name: 订单行
    domain: 订单
    grain: 一行一个 SKU 明细，GMV grain
  - name: fact_payment
    business_name: 支付
    domain: 支付
    grain: 一行一次支付尝试
  - name: fact_refund
    business_name: 退款
    domain: 退款
    grain: 一行一笔退款
  - name: fact_traffic
    business_name: 流量
    domain: 用户
    grain: 一行=某店某渠道某日访客
  - name: fact_ad_spend
    business_name: 广告花费
    domain: 营销
    grain: 一行=某活动某渠道某月花费

relations:
  - left: fact_order
    left_col: user_id
    right: dim_user
    right_col: id
  - left: fact_order
    left_col: store_id
    right: dim_store
    right_col: id
  - left: fact_order
    left_col: channel_id
    right: dim_channel
    right_col: id
  - left: fact_order
    left_col: campaign_id
    right: dim_campaign
    right_col: id
  - left: fact_order_item
    left_col: order_id
    right: fact_order
    right_col: id
  - left: fact_order_item
    left_col: sku_id
    right: dim_sku
    right_col: id
  - left: dim_sku
    left_col: category_id
    right: dim_category
    right_col: id
  - left: fact_payment
    left_col: order_id
    right: fact_order
    right_col: id
  - left: fact_refund
    left_col: order_id
    right: fact_order
    right_col: id
  - left: fact_refund
    left_col: order_item_id
    right: fact_order_item
    right_col: id
  - left: dim_campaign
    left_col: channel_id
    right: dim_channel
    right_col: id
  - left: fact_ad_spend
    left_col: campaign_id
    right: dim_campaign
    right_col: id
  - left: fact_ad_spend
    left_col: channel_id
    right: dim_channel
    right_col: id
  - left: fact_traffic
    left_col: store_id
    right: dim_store
    right_col: id
  - left: fact_traffic
    left_col: channel_id
    right: dim_channel
    right_col: id
