# 10 个审核指标。公式由 MetricCompiler 使用，禁止 LLM 改写。
- metric_id: gmv
  name: GMV
  version: 1
  grain_table: fact_order_item
  formula: SUM(oi.price * oi.qty)
  time_field: fact_order.created_at
  unit: CNY
  filters:
    - field: fact_order.status
      op: in
      value: [paid, shipped, completed]
  deps:
    - fact_order_item.price
    - fact_order_item.qty
    - fact_order.status
    - fact_order.created_at
  needs_tables: []

- metric_id: paid_gmv
  name: 实付GMV
  version: 1
  grain_table: fact_order_item
  formula: SUM(oi.pay_amt)
  time_field: fact_order.paid_at
  unit: CNY
  filters:
    - field: fact_order.status
      op: in
      value: [paid, shipped, completed]
  deps:
    - fact_order_item.pay_amt
    - fact_order.status
    - fact_order.paid_at
  needs_tables: []

- metric_id: net_gmv
  name: 净GMV
  version: 1
  grain_table: fact_order_item
  formula: SUM(oi.pay_amt) - COALESCE(SUM(r.amount), 0)
  time_field: fact_order.paid_at
  unit: CNY
  filters:
    - field: fact_order.status
      op: in
      value: [paid, shipped, completed]
  deps:
    - fact_order_item.pay_amt
    - fact_refund.amount
    - fact_order.status
  needs_tables: []

- metric_id: order_count
  name: 订单量
  version: 1
  grain_table: fact_order
  formula: COUNT(DISTINCT o.id)
  time_field: fact_order.created_at
  unit: count
  filters:
    - field: fact_order.status
      op: in
      value: [paid, shipped, completed]
  deps:
    - fact_order.id
    - fact_order.status
    - fact_order.created_at
  needs_tables: []

- metric_id: aov
  name: 客单价
  version: 1
  grain_table: fact_order
  formula: SUM(oi.pay_amt) / NULLIF(COUNT(DISTINCT o.id), 0)
  time_field: fact_order.paid_at
  unit: CNY
  filters:
    - field: fact_order.status
      op: in
      value: [paid, shipped, completed]
  deps:
    - fact_order_item.pay_amt
    - fact_order.id
  needs_tables: []

- metric_id: refund_rate
  name: 退款率
  version: 1
  grain_table: fact_refund
  formula: SUM(r.amount) / NULLIF(SUM(oi.pay_amt), 0)
  time_field: fact_refund.refunded_at
  unit: ratio
  filters:
    - field: fact_refund.status
      op: "="
      value: success
  deps:
    - fact_refund.amount
    - fact_order_item.pay_amt
  needs_tables: []

- metric_id: cvr
  name: 转化率
  version: 1
  grain_table: fact_order
  formula: COUNT(DISTINCT o.user_id) / NULLIF(SUM(t.visitor_cnt), 0)
  time_field: fact_traffic.dt
  unit: ratio
  filters:
    - field: fact_order.status
      op: in
      value: [paid, shipped, completed]
  deps:
    - fact_order.user_id
    - fact_traffic.visitor_cnt
  needs_tables:
    - fact_traffic

- metric_id: new_customers
  name: 新客数
  version: 1
  grain_table: fact_order
  formula: >-
    COUNT(DISTINCT CASE WHEN u.first_order_at >= :start AND u.first_order_at < :end THEN o.user_id END)
  time_field: dim_user.first_order_at
  unit: count
  filters:
    - field: fact_order.status
      op: in
      value: [paid, shipped, completed]
  deps:
    - dim_user.first_order_at
    - fact_order.user_id
  needs_tables: []

- metric_id: repurchase_rate
  name: 复购率
  version: 1
  grain_table: fact_order
  formula: >-
    COUNT(DISTINCT CASE WHEN order_cnt >= 2 THEN user_id END) / NULLIF(COUNT(DISTINCT user_id), 0)
  time_field: fact_order.created_at
  unit: ratio
  filters:
    - field: fact_order.status
      op: in
      value: [paid, shipped, completed]
  deps:
    - fact_order.user_id
    - fact_order.id
  needs_tables: []

- metric_id: ad_roi
  name: 广告ROI
  version: 1
  grain_table: fact_order_item
  formula: SUM(oi.pay_amt) / NULLIF(SUM(a.amount), 0)
  time_field: fact_ad_spend.dt_month
  unit: ratio
  filters:
    - field: fact_order.campaign_id
      op: "!="
      value: null
  deps:
    - fact_order_item.pay_amt
    - fact_ad_spend.amount
    - fact_order.campaign_id
  needs_tables:
    - fact_ad_spend
    - dim_campaign
