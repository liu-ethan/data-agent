- operation_type: update_sku_status
  target_table: dim_sku
  allowed_columns:
    - status
  sql_template: >-
    UPDATE dim_sku SET status = :status, row_version = row_version + 1
    WHERE id IN :ids
  required_params:
    - status
  max_affected_rows: 100
  version_predicate: row_version
  locking_read: false
  must_hitl: true
- operation_type: adjust_sku_inventory
  target_table: dim_sku
  allowed_columns:
    - inventory_qty
  sql_template: >-
    UPDATE dim_sku SET inventory_qty = :inventory_qty, row_version = row_version + 1
    WHERE id IN :ids
  required_params:
    - inventory_qty
  max_affected_rows: 100
  locking_read: true
  must_hitl: true
